<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Questionnaire Port Center Marseille – BTS SAM</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mut:#5b6678;--bt:#fff;--pri:#1f5fae;--bd:#d5dbe6;--ok:#1d7a46;--okb:#e3f4ea;--ko:#b3261e;--kob:#fbe8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2232;--tx:#e8edf6;--mut:#9aa6ba;--bt:#0b1220;--pri:#6aa6ff;--bd:#2c374d;--ok:#5fd394;--okb:#173326;--ko:#ff8a80;--kob:#3a1d1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2232;--tx:#e8edf6;--mut:#9aa6ba;--bt:#0b1220;--pri:#6aa6ff;--bd:#2c374d;--ok:#5fd394;--okb:#173326;--ko:#ff8a80;--kob:#3a1d1b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.35rem;margin:8px 0 4px;color:var(--pri)}
h2{font-size:1.05rem;margin:26px 0 8px;color:var(--pri)}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.q{font-weight:600;margin:0 0 10px}.q small{font-weight:400;color:var(--mut)}
label.o{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer}
label.o input{width:20px;height:20px;flex:none}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row span{flex:1}.row select,.row input{flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;background:var(--pri);color:var(--bt);width:100%;margin-top:18px;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri);margin-top:10px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.92rem}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.ko{background:var(--kob);color:var(--ko)}
.fb.self{background:var(--bg);border:1px dashed var(--bd);color:var(--tx)}
.fb b{display:block;margin-bottom:2px}
#res{position:relative}
.score{font-size:2rem;font-weight:700;color:var(--pri);margin:0}
.bar{height:8px;background:var(--bd);border-radius:6px;margin:8px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);width:0}
</style>
</head>
<body>
<main>
<h1>Visite du Port Center Marseille</h1>
<p class="sub">BTS Support à l’Action Managériale · 15 questions · 20 points · environ 20 minutes</p>
<div class="card"><label for="nom" class="q">Nom et prénom</label><input type="text" id="nom" autocomplete="name"></div>
<div id="res"></div>
<form id="f" onsubmit="return false"></form>
<button id="go" type="button">Valider mes réponses</button>
<p class="sub" id="hint" style="text-align:center;margin-top:10px">Les questions à choix et les associations sont corrigées automatiquement. Pour les réponses écrites, vous comparez avec la réponse attendue et vous vous attribuez vos points.</p>
</main>
<script>
const Q=[
{part:"Partie 1 : Le lieu et l’organisation de la visite"},
{t:"qcm",pts:1,q:"Dans quel bâtiment le Port Center est-il installé ?",o:["Le Silo d’Arenc","La gare maritime de la Major","Le Palais du Pharo","Le J4 du Mucem"],a:1,exp:"La gare maritime de la Major (24 bd Jacques Saadé)."},
{t:"qcm",pts:1,q:"Quel type de structure est le Port Center ?",o:["Un musée d’art","Un terminal de croisière","Un centre d’interprétation","Une capitainerie"],a:2,exp:"Un centre d’interprétation."},
{t:"vf",pts:1,q:"Vrai ou faux : le Port Center a été inauguré en octobre 2024.",a:"v",exp:"Vrai."},
{t:"open",pts:1,q:"Citez trois des partenaires à l’origine du projet.",exp:"Trois parmi : Métropole Aix-Marseille-Provence, Ville de Marseille, port de Marseille Fos, l’État, la Région Sud, organisations professionnelles."},
{t:"open",pts:1,q:"Quelle est la durée de la visite guidée, et à qui s’adresse-t-elle ?",exp:"1 h 30, tous publics."},
{part:"Partie 2 : Les contenus de la visite"},
{t:"open",pts:1,q:"Citez trois supports ou outils utilisés pendant la visite pour comprendre le monde portuaire.",exp:"Trois parmi : vidéos immersives, réalité virtuelle, vues aériennes, expositions, tablettes interactives, ateliers."},
{t:"qcm",pts:1,q:"À partir de quel siècle le parcours retrace-t-il l’évolution du port ?",o:["XVIe siècle","XVIIIe siècle","XIXe siècle","XXe siècle"],a:2,exp:"XIXe siècle."},
{t:"open",pts:2,q:"Citez deux engagements environnementaux du port présentés pendant la visite.",exp:"Deux parmi : électrification des quais, énergies renouvelables, excellence environnementale, économie circulaire."},
{t:"cls",pts:1,q:"Le port de Marseille Fos est « polyvalent et multi-filières ». Classez chaque trafic.",items:["Conteneurs","Vracs liquides","Roulier et voitures","Vracs solides"],opts:["Marchandises diverses","Vracs"],ans:[0,1,0,1],exp:"Marchandises diverses : conteneurs, roulier et voitures. Vracs : vracs liquides, vracs solides."},
{t:"open",pts:1,q:"Vers quelles destinations le port propose-t-il des lignes régulières de passagers ?",exp:"Corse, Algérie, Tunisie, Maroc."},
{part:"Partie 3 : Chiffres clés et port de Fos"},
{t:"fill",pts:1,q:"Complétez : Marseille est le … port de croisière de France et le … de Méditerranée.",exp:"Premier port de croisière de France et 4e de Méditerranée."},
{t:"qcm",pts:1,q:"Combien de croisiéristes le port a-t-il accueillis en 2025 ?",o:["Environ 500 000","Plus de 1,2 million","Plus de 2,6 millions","Plus de 5 millions"],a:2,exp:"Plus de 2,6 millions."},
{t:"open",pts:1,q:"Le bassin Ouest du port se situe à Fos-sur-Mer. Citez deux grandes fonctions de ce site.",exp:"Deux parmi : industrie, logistique, grands flux intercontinentaux (conteneurs, vracs), énergie (produits pétroliers et chimiques, gaz naturel liquéfié)."},
{t:"mat",pts:2,q:"Associez chaque entreprise de la zone industrialo-portuaire de Fos à son activité.",items:["ArcelorMittal","Elengy (Fos Tonkin et Fos Cavaou)","Esso (groupe ExxonMobil)","Club Fos Logistique (zone Distriport)"],opts:["Sidérurgie (acier)","Terminaux méthaniers (GNL)","Pétrole (raffinage, pétrochimie)","Logistique et entreposage"],ans:[0,1,2,3],exp:"ArcelorMittal : sidérurgie ; Elengy : terminaux méthaniers ; Esso : pétrole ; Club Fos Logistique : logistique."},
{part:"Partie 4 : Question de synthèse"},
{t:"open",pts:4,q:"Votre entreprise organise une visite du Port Center pour un groupe de 20 personnes. Rédigez les informations pratiques à communiquer : lieu de rendez-vous, accès en transports, durée, réservation et un intérêt de la visite.",big:1,exp:"Rendez-vous au 24 bd Jacques Saadé, 13002 Marseille ; accès métro ligne 2 (Joliette), tram T2/T3 (Joliette), bus 49, 82, 82s, 60 ou 35, ou voiture par l’A55 (sortie Joliette) ; durée 1 h 30 ; réservation via l’Office de Tourisme (gratuit le samedi) ou par mail à portcenter@marseille-port.fr pour un groupe ; un intérêt (histoire du port, enjeux environnementaux, métiers…)."}
];
const f=document.getElementById('f');let n=0;const idx=[];
const sel=(id,opts)=>`<select id="${id}"><option value="">Choisir…</option>${opts.map((o,k)=>`<option value="${k}">${o}</option>`).join('')}</select>`;
Q.forEach((q,i)=>{
 if(q.part){f.insertAdjacentHTML('beforeend',`<h2>${q.part}</h2>`);return}
 n++;q.n=n;idx.push(i);let b='';
 if(q.t==='qcm')b=q.o.map((o,k)=>`<label class="o"><input type="radio" name="q${i}" value="${k}">${o}</label>`).join('');
 if(q.t==='vf')b=`<label class="o"><input type="radio" name="q${i}" value="v">Vrai</label><label class="o"><input type="radio" name="q${i}" value="f">Faux</label>`;
 if(q.t==='open')b=`<textarea id="q${i}" ${q.big?'style="min-height:150px"':''}></textarea>`;
 if(q.t==='fill')b=`<div class="row"><span>Marseille est le</span><input type="text" id="q${i}_0" placeholder="…"></div><div class="row"><span>port de croisière de France et le</span><input type="text" id="q${i}_1" placeholder="…"></div><div class="row"><span>de Méditerranée</span></div>`;
 if(q.t==='cls'||q.t==='mat')b=q.items.map((it,k)=>`<div class="row"><span>${it}</span>${sel(`q${i}_${k}`,q.opts)}</div>`).join('');
 f.insertAdjacentHTML('beforeend',`<div class="card" id="c${i}"><p class="q">${q.n}. ${q.q} <small>(${q.pts} pt${q.pts>1?'s':''})</small></p>${b}<div id="fb${i}"></div></div>`);
});
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const earned={};
function check(){
 const nom=document.getElementById('nom').value.trim();
 Q.forEach((q,i)=>{
  if(!q.t)return;let e=null,msg='';
  if(q.t==='qcm'||q.t==='vf'){const r=document.querySelector(`input[name=q${i}]:checked`);const v=r&&(q.t==='qcm'?+r.value:r.value);e=(r&&v===q.a)?q.pts:0}
  if(q.t==='fill'){const a=norm(document.getElementById(`q${i}_0`).value),c=norm(document.getElementById(`q${i}_1`).value);e=(/^(1|1er|1ere|premier|premiere)$/.test(a)&&/^(4|4e|4eme|quatrieme)$/.test(c))?1:0}
  if(q.t==='cls'||q.t==='mat'){let ok=0;q.ans.forEach((a,k)=>{if(document.getElementById(`q${i}_${k}`).value===String(a))ok++});e=q.t==='cls'?(ok===q.ans.length?q.pts:0):ok*0.5}
  const fb=document.getElementById('fb'+i);
  if(q.t==='open'){
   const mine=document.getElementById('q'+i).value.trim()||'(pas de réponse)';
   const st=[];for(let p=0;p<=q.pts;p+=0.5)st.push(`<option value="${p}">${p}</option>`);
   fb.innerHTML=`<div class="fb self"><b>Votre réponse</b>${mine.replace(/</g,'&lt;')}</div><div class="fb ok"><b>Réponse attendue</b>${q.exp}</div><div class="row"><span>Mes points (sur ${q.pts})</span><select id="s${i}" style="max-width:110px">${st.join('')}</select></div>`;
   earned[i]=0;document.getElementById('s'+i).onchange=e2=>{earned[i]=+e2.target.value;total()};
  }else{
   earned[i]=e;const full=e===q.pts;
   fb.innerHTML=`<div class="fb ${full?'ok':'ko'}"><b>${full?'Correct':(e>0?'Partiellement correct ('+e+' pt)':'Incorrect')}</b>${full?'':'Réponse attendue : '+q.exp}</div>`;
  }
 });
 f.querySelectorAll('input,textarea,select').forEach(x=>{if(!x.id.startsWith('s'))x.disabled=true});
 document.getElementById('nom').disabled=true;
 const go=document.getElementById('go');go.style.display='none';document.getElementById('hint').style.display='none';
 document.getElementById('res').innerHTML=`<div class="card"><p class="sub" style="margin:0">Votre score</p><p class="score"><span id="sc">0</span> / 20</p><div class="bar"><i id="br"></i></div><p class="sub">Descendez pour lire les corrections. Pour les questions écrites, attribuez-vous vos points : le score se met à jour.</p><textarea id="sum" readonly style="min-height:120px;font-size:.85rem"></textarea><button type="button" id="cp">Copier mon résultat</button><button type="button" class="sec" id="rs">Recommencer</button></div>`;
 document.getElementById('rs').onclick=()=>location.reload();
 document.getElementById('cp').onclick=async()=>{const t=document.getElementById('sum');try{await navigator.clipboard.writeText(t.value);document.getElementById('cp').textContent='Copié ✓'}catch(e){t.select();try{document.execCommand('copy');document.getElementById('cp').textContent='Copié ✓'}catch(e2){document.getElementById('cp').textContent='Sélectionnez le texte et copiez-le'}}};
 window.NOM=nom||'(nom non renseigné)';total();
 document.getElementById('res').scrollIntoView({behavior:'smooth'});
}
function total(){
 let s=0;const L=[];idx.forEach(i=>{const q=Q[i],e=earned[i]||0;s+=e;L.push(`Q${q.n} : ${e}/${q.pts}`)});
 document.getElementById('sc').textContent=s;document.getElementById('br').style.width=(s/20*100)+'%';
 document.getElementById('sum').value=`Port Center Marseille – ${window.NOM}\nScore : ${s} / 20\n${L.join(' | ')}`;
}
document.getElementById('go').onclick=()=>{
 const miss=Q.filter((q,i)=>q.t&&((q.t==='qcm'||q.t==='vf')?!document.querySelector(`input[name=q${i}]:checked`):q.t==='open'?!document.getElementById('q'+i).value.trim():false)).length;
 if(miss&&!confirm(`Il reste ${miss} question(s) sans réponse. Valider quand même ?`))return;
 check();
};
</script>
</body>
</html>
